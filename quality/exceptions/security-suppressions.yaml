# Security suppressions -- each entry must have all required fields.
# Max expiration: 90 days from today.
#
# Fields:
#   rule_id   -- (required) scanner rule being suppressed
#   owner     -- (required) person responsible; must have an expiry reminder
#   reason    -- (required) why this finding is suppressed
#   issue_url -- (required) tracking issue URL
#   expires   -- (required) YYYY-MM-DD; max 90 days from creation
#
# Example:
#   - rule_id: gitleaks-generic-api-key
#     owner: devops@cabulous.com
#     reason: Test key in fixture; not shipped
#     issue_url: https://github.com/Cabulous-Corp/cabulous/issues/42
#     expires: "2026-10-01"
