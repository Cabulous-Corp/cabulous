name: Quality (Scheduled)

on:
  schedule:
    # Runs weekly on Sunday at 06:00 UTC
    - cron: "0 6 * * 0"
  workflow_dispatch:

jobs:
  mutation-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: service
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4

      - run: uv python install 3.13

      - uses: actions/cache@v4
        with:
          path: service/.venv
          key: uv-${{ runner.os }}-${{ hashFiles('service/uv.lock') }}

      - run: uv sync --all-groups

      - name: Run mutation tests (critical domain only)
        run: uv run mutmut run --paths-to-mutate core/ --tests-dir tests/ --use-cache

      - name: Generate mutation report
        if: always()
        run: uv run mutmut results > mutation-results.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutation-results
          path: |
            service/mutation-results.txt
          retention-days: 30
